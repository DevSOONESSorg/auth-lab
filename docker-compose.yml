# 起動:  docker compose up --build
# web : http://localhost:4000  ログイン教材アプリ（第1・2段）
# api : http://localhost:4001  社員マスタAPI（第3段）
services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-4000}:3000"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/data:/app/data
    environment:
      - TZ=Asia/Tokyo
      - HOST_PORT=${WEB_PORT:-4000}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-session-secret}
      - API_BASE_URL=http://api:3000        # コンテナ同士は名前で通信できる
      - API_AUTH_MODE=${API_AUTH_MODE:-none}
      - API_KEY=${API_KEY:-}
      - API_CLIENT_ID=${API_CLIENT_ID:-}
      - API_CLIENT_SECRET=${API_CLIENT_SECRET:-}
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "${API_PORT:-4001}:3000"
    volumes:
      - ./api/src:/app/src
    environment:
      - TZ=Asia/Tokyo
      - HOST_PORT=${API_PORT:-4001}
      - API_AUTH_MODE=${API_AUTH_MODE:-none}
      - API_KEY=${API_KEY:-}
      - API_CLIENT_ID=${API_CLIENT_ID:-}
      - API_CLIENT_SECRET=${API_CLIENT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt-secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-10m}
